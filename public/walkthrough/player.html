<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Tour Player</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --primary: #0369A1;
            --bg-dark: #020617;
        }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-dark); 
            height: 100vh; overflow: hidden; 
            color: #f8fafc;
        }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        
        #panorama { width: 100%; height: 100%; }
        
        /* Glassmorphism Classes */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Hotspot Styling */
        .walking-hotspot {
            height: 36px; width: 36px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        @media (min-width: 640px) {
            .walking-hotspot { height: 44px; width: 44px; }
        }
        .walking-hotspot:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }
        .walking-hotspot::after {
            content: ''; 
            width: 8px; height: 8px;
            border-top: 2.5px solid #fff; 
            border-right: 2.5px solid #fff;
            transform: rotate(-45deg); 
            margin-top: 2px;
        }
        @media (min-width: 640px) {
            .walking-hotspot::after { width: 10px; height: 10px; border-top-width: 3px; border-right-width: 3px; }
        }
        
        .info-hotspot {
            height: 32px; width: 32px;
            background: var(--primary);
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(3, 105, 161, 0.5);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        @media (min-width: 640px) {
            .info-hotspot { height: 36px; width: 36px; }
        }
        .info-hotspot:hover {
            transform: scale(1.1);
            background: #0ea5e9;
        }
        .info-hotspot svg {
            color: white;
            width: 20px;
            height: 20px;
        }

        .pulse-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid white;
            animation: pulse 2s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        /* Pannellum Overrides */
        .pnlm-control-bar { background: rgba(15, 23, 42, 0.8) !important; backdrop-filter: blur(8px); }
        .pnlm-zoom-controls, .pnlm-fullscreen-toggle-button { background: transparent !important; }
    </style>
</head>
<body class="bg-slate-950">

    <div id="tour-wrapper" class="relative w-full h-full">
        <!-- Header Overlay -->
        <div id="overlay" class="absolute top-4 left-4 sm:top-6 sm:left-6 z-20 glass p-3 sm:p-5 rounded-lg sm:rounded-xl max-w-[calc(100%-2rem)] sm:max-w-sm pointer-events-none transition-all duration-500 opacity-0 transform -translate-y-4">
            <h2 id="scene-title" class="text-lg sm:text-xl font-bold text-white mb-0.5 sm:mb-1">Loading Tour...</h2>
            <div class="flex items-center text-slate-400 text-xs sm:text-sm">
                <i data-lucide="map-pin" class="w-3 h-3 sm:w-4 sm:h-4 mr-1.5 sm:mr-2"></i>
                <span>Explore the space</span>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="absolute bottom-4 right-4 sm:bottom-6 sm:right-6 z-20 flex flex-col gap-2 sm:gap-3">
            <button id="fullscreen-btn" onclick="toggleFullscreen()" class="glass px-3 py-2 sm:px-4 sm:py-2.5 rounded-lg flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm font-medium hover:bg-white/20 transition-all">
                <i data-lucide="maximize" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                <span class="hidden xs:inline">Fullscreen</span>
            </button>
        </div>

        <!-- Modal Backdrop -->
        <div id="modal-backdrop" onclick="closeModal()" class="absolute inset-0 bg-black/60 backdrop-blur-md z-[100] hidden opacity-0 transition-opacity duration-300"></div>
        
        <!-- Info Modal -->
        <div id="info-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[95%] sm:w-[90%] max-w-5xl z-[101] hidden flex-col opacity-0 transition-all duration-300 scale-95 max-h-[90vh]">
            <!-- Floating Close Button -->
            <button onclick="closeModal()" class="absolute -top-10 sm:-top-12 right-0 p-1.5 sm:p-2 rounded-full glass hover:bg-white/20 transition-all text-white z-[102]">
                <i data-lucide="x" class="w-5 h-5 sm:w-6 sm:h-6"></i>
            </button>
            <div id="modal-content" class="w-full h-full overflow-y-auto rounded-xl sm:rounded-2xl">
                <!-- Content injected here -->
            </div>
        </div>

        <div id="panorama"></div>
    </div>

    <!-- Scripts -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        let viewer = null;
        let tourData = null;

        function toggleFullscreen() {
            const wrapper = document.getElementById('tour-wrapper');
            const btn = document.getElementById('fullscreen-btn');
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => {
                    alert(`Error: ${err.message}`);
                });
                btn.innerHTML = '<i data-lucide="minimize"></i><span>Exit Fullscreen</span>';
            } else {
                document.exitFullscreen();
                btn.innerHTML = '<i data-lucide="maximize"></i><span>Fullscreen</span>';
            }
            lucide.createIcons();
        }

        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreen-btn');
            if (!document.fullscreenElement) {
                btn.innerHTML = '<i data-lucide="maximize"></i><span>Fullscreen</span>';
            } else {
                btn.innerHTML = '<i data-lucide="minimize"></i><span>Exit Fullscreen</span>';
            }
            lucide.createIcons();
        });

        fetch('tour_config.json')
            .then(response => response.json())
            .then(data => {
                tourData = data;
                initTour(data);
            })
            .catch(err => {
                document.getElementById('scene-title').innerText = "Configuration Error";
                console.error(err);
            });

        function initTour(config) {
            for (let sceneId in config.scenes) {
                config.scenes[sceneId].hotSpots.forEach(hs => {
                    if (hs.type === 'scene') {
                        hs.clickHandlerFunc = animateToScene;
                        hs.clickHandlerArgs = { targetId: hs.sceneId, pitch: hs.pitch, yaw: hs.yaw };
                        hs.cssClass = "walking-hotspot";
                    } else {
                        hs.clickHandlerFunc = showInfoPopup;
                        hs.clickHandlerArgs = { title: hs.title || "Information", content: hs.infoContent || hs.text };
                        hs.cssClass = "info-hotspot";
                    }
                });
            }

            viewer = pannellum.viewer('panorama', {
                ...config,
                "showControls": true,
                "compass": true,
                "autoLoad": true
            });

            viewer.on('load', function() {
                const sceneId = viewer.getScene();
                const title = document.getElementById('scene-title');
                const overlay = document.getElementById('overlay');
                
                title.innerText = config.scenes[sceneId].title;
                overlay.classList.remove('opacity-0', '-translate-y-4');
                
                // Add pulse effect to hotspots after load
                const hotspots = document.querySelectorAll('.walking-hotspot, .info-hotspot');
                hotspots.forEach(hs => {
                    if (!hs.querySelector('.pulse-ring')) {
                        const ring = document.createElement('div');
                        ring.className = 'pulse-ring';
                        hs.appendChild(ring);
                    }
                    if (hs.classList.contains('info-hotspot') && !hs.querySelector('svg')) {
                        hs.innerHTML += '<i data-lucide="info" class="w-5 h-5 text-white"></i>';
                    }
                });
                lucide.createIcons();
            });
        }

        function showInfoPopup(e, args) {
            const modal = document.getElementById('info-modal');
            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');

            if (args.title === "Menu") {
                const escapedContent = args.content.replace(/"/g, '&quot;');
                const isMobile = window.innerWidth < 768;
                const iframeHeight = isMobile ? '85vh' : '600px';
                content.innerHTML = `<iframe srcdoc="${escapedContent}" style="width:100%; height:${iframeHeight}; border:none; background:transparent;"></iframe>`;
                modal.classList.add('max-w-5xl');
                modal.classList.remove('max-w-2xl');
            }
 else {
                content.innerHTML = `<div class="glass p-5 sm:p-8 rounded-xl sm:rounded-2xl text-slate-200 leading-relaxed text-sm sm:text-base">${args.content}</div>`;
                modal.classList.add('max-w-2xl');
                modal.classList.remove('max-w-5xl');
            }

            modal.classList.remove('hidden');
            backdrop.classList.remove('hidden');
            
            setTimeout(() => {
                modal.classList.add('opacity-100', 'scale-100');
                modal.classList.remove('opacity-0', 'scale-95');
                backdrop.classList.add('opacity-100');
                backdrop.classList.remove('opacity-0');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('info-modal');
            const backdrop = document.getElementById('modal-backdrop');

            modal.classList.remove('opacity-100', 'scale-100');
            modal.classList.add('opacity-0', 'scale-95');
            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
                backdrop.classList.add('hidden');
            }, 300);
        }

        function animateToScene(e, args) {
            const targetId = args.targetId;
            const pitch = args.pitch;
            const yaw = args.yaw;
            
            // Hide overlay during transition
            document.getElementById('overlay').classList.add('opacity-0', '-translate-y-4');
            
            viewer.lookAt(pitch, yaw, 60, 500, () => {
                let currentHfov = viewer.getHfov();
                let zoomTarget = 20;
                const step = (currentHfov - zoomTarget) / 20;
                let count = 0;
                const zoomInterval = setInterval(() => {
                    currentHfov -= step;
                    viewer.setHfov(currentHfov);
                    count++;
                    if (count >= 20) {
                        clearInterval(zoomInterval);
                        viewer.loadScene(targetId);
                        setTimeout(() => viewer.setHfov(100), 500);
                    }
                }, 16);
            });
        }
    </script>
</body>
</html>
