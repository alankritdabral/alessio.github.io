<!DOCTYPE html>
<html lang="en">
<head>

    <title>Loulou - Menu Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a059;
            --primary-hover: #b38f4d;
            --secondary: #1a1a1a;
            --accent: #222222;
            --background: #ffffff;
            --foreground: #111111;
            --muted: #666666;
            --border: #e5e5e5;
            --header-font: 'Playfair Display', serif;
            --body-font: 'Inter', sans-serif;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--body-font);
            background-color: transparent !important;
            color: #fff; /* Lighten text for transparency */
            line-height: 1.4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .book-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .book {
            width: 98%;
            max-width: 900px;
            height: 95%;
            max-height: 600px;
            position: relative;
            display: flex;
            background: rgba(0, 0, 0, 0.5); /* 50% Transparent Navy */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .book::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .page {
            width: 50%;
            height: 100%;
            padding: 30px 45px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: transparent;
        }

        .page-left {
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .page-content {
            flex-grow: 1;
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .page-content.active {
            opacity: 1;
        }

        .section-title {
            font-family: var(--header-font);
            font-size: 1.5rem;
            color: #fff;
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .price-legend {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: right;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
            min-height: 1.2rem;
        }

        .menu-item {
            margin-bottom: 8px;
            position: relative;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
            gap: 10px;
        }

        .item-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: #f8fafc;
            flex: 1;
            font-family: var(--header-font);
        }

        .item-price {
            font-weight: 700;
            color: var(--primary);
            font-family: var(--body-font);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .item-desc {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
            line-height: 1.3;
        }

        .featured-tag {
            color: var(--primary);
            font-size: 0.55rem;
            margin-left: 6px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 6px 14px;
            cursor: pointer;
            font-family: var(--body-font);
            font-weight: 600;
            font-size: 0.7rem;
            border-radius: 6px;
            transition: all 0.2s;
            position: absolute;
            bottom: 20px;
            z-index: 30;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            backdrop-filter: blur(4px);
        }

        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }

        .nav-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .nav-btn:disabled {
            display: none;
        }

        /* Mobile Paging for Menu - One page at a time */
        @media (max-width: 768px) {
            body {
                overflow: hidden !important;
                height: 100vh !important;
                margin: 0 !important;
                padding: 0 !important;
                display: block !important;
                background: #020617 !important;
            }
            .book-container {
                height: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                display: block !important;
            }
            .book {
                display: flex !important;
                flex-direction: row !important;
                height: 100% !important;
                width: 100% !important;
                overflow-x: auto !important;
                scroll-snap-type: x mandatory !important;
                -webkit-overflow-scrolling: touch !important;
                border-radius: 0 !important;
                background: rgba(0, 0, 0, 0.5) !important;
                max-height: none !important;
                box-shadow: none !important;
                border: none !important;
            }
            .book::before { display: none !important; }

            .page {
                flex: 0 0 100% !important;
                width: 100% !important;
                height: 100% !important;
                scroll-snap-align: start !important;
                overflow-y: auto !important;
                padding: 60px 25px 40px 25px !important;
                border: none !important;
                background: transparent !important;
                box-sizing: border-box !important;
            }
            .section-title {
                font-size: 1.3rem !important;
                text-align: center !important;
                margin-bottom: 20px !important;
                margin-top: 10px !important;
            }
            /* Visual Swipe Indicator */
            .book-container::after {
                content: '← Swipe to flip →';
                position: fixed;
                top: 20px;
                left: 0;
                right: 0;
                text-align: center;
                font-size: 0.7rem;
                color: rgba(197, 160, 89, 0.6);
                font-family: var(--body-font);
                letter-spacing: 2px;
                text-transform: uppercase;
                pointer-events: none;
                z-index: 100;
            }
            .nav-btn { display: none !important; }
        }
        
        /* Slider Layout for ALL devices */
        .book {
            display: flex !important;
            flex-direction: row !important;
            overflow-x: auto !important;
            scroll-snap-type: x mandatory !important;
            -webkit-overflow-scrolling: touch !important;
            cursor: grab;
            user-select: none;
        }
        .book:active {
            cursor: grabbing;
        }
        .book::-webkit-scrollbar {
            display: none;
        }
        .book::before { display: none !important; }
        
        .page {
            flex: 0 0 100% !important;
            width: 100% !important;
            scroll-snap-align: start !important;
            border: none !important;
            box-sizing: border-box !important;
            padding: 40px 60px !important;
            background: transparent !important;
        }

        /* Desktop Arrows for Slider */
        .slider-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s;
            backdrop-filter: blur(8px);
        }
        .slider-nav:hover {
            background: var(--primary);
            border-color: var(--primary);
        }
        .slider-nav.prev { left: 10px; }
        .slider-nav.next { right: 10px; }
        
        @media (max-width: 768px) {
            .slider-nav { display: none !important; }
            .page { padding: 60px 25px 40px 25px !important; }
        }
    
    </style>

</head>

<div class="book-container">
    <div class="slider-nav prev" onclick="moveSlider(-1)">&larr;</div><div class="slider-nav next" onclick="moveSlider(1)">&rarr;</div><div class="book" id="book">
        <!-- Left Page -->
        <div class="page page-left">

            <div id="left-content" class="page-content active">
                <!-- Content will be injected here -->
            </div>
        </div>
        
        <!-- Right Page -->

            <div id="right-content" class="page-content active">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>
</div>

    function renderPageContent(data) {
        var html = '<h2 class="section-title">' + data.title + "</h2>";
        html += '<div class="price-legend">' + (data.legend || "") + "</div>";
        
        data.items.forEach(function(item) {
            html += '<div class="menu-item">' +
                        '<div class="item-header">' +
                            '<span class="item-name">' + item.name + (item.featured ? ' <span class="featured-tag">Special</span>' : "") + "</span>" +
                            '<span class="item-price">' + item.price + "</span>" +
                        "</div>" +
                        '<p class="item-desc">' + item.desc + "</p>" +
                    "</div>";
        });
        return html;
    }
    
    function renderPages() {
        const book = document.getElementById("book");
        let fullHtml = '';
        menuData.forEach((data) => {
            fullHtml += '<div class="page"><div class="page-content active">' + renderPageContent(data) + '</div></div>';
        });
        // Closing page
        fullHtml += '<div class="page"><div class="page-content active" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: rgba(255,255,255,0.4); font-size: 0.8rem;"><p>FOLLOW US @ALESSIOSCAFE</p><p style="margin-top: 10px;">OPEN DAILY 08:00 — 18:00</p></div></div>';
        book.innerHTML = fullHtml;
        initDragScroll();
    }

    function moveSlider(direction) {
        const book = document.getElementById("book");
        const scrollAmount = book.clientWidth;
        book.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function initDragScroll() {
        const slider = document.getElementById('book');
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.style.cursor = 'grabbing';
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.style.cursor = 'grab';
        });
        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.style.cursor = 'grab';
        });
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2;
            slider.scrollLeft = scrollLeft - walk;
        });
    }
    renderPages();
</script>
